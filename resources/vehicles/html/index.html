<!DOCTYPE html>
<html lang="fr">
<head>

<title>Véhicules</title>
<link rel="stylesheet" href="style.css">
</head>

        <span id="panel-title">Concession</span>
        <button id="close-btn" class="close-btn">✕</button>
      </div>
      <div class="panel-body">
        <div id="view-dealership" class="view hidden">
          <div id="catalog-grid" class="grid"></div>
        </div>
        <div id="view-garage" class="view hidden">
          <div id="garage-list" class="list"></div>
        </div>
        <div id="view-impound" class="view hidden">
          <div id="impound-list" class="list"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
