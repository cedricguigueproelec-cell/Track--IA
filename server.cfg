## =====================================================================
## Track-IA RP — server.cfg
## Serveur FiveM (GTA V) Roleplay — configuration prête à l'emploi.
## Remplissez les valeurs marquées "A REMPLIR" avant de lancer en prod.
## =====================================================================

# -----------------------------------------------------------------------
# IDENTITE DU SERVEUR
# -----------------------------------------------------------------------
sv_hostname "Track-IA RP | Roleplay Nouvelle Génération | discord.gg/AREMPLIR"
sets sv_projectName "Track-IA RP"
sets sv_projectDesc "Serveur Roleplay FiveM — economie, police, EMS, jobs, logements"
sets tags "roleplay,francophone,economy,whitelist"
sets locale "fr-FR"

# -----------------------------------------------------------------------
# RESEAU
# -----------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# sv_maxclients DOIT être une puissance de 2 avec OneSync (32/64/128/256)
set sv_maxclients 64
sv_lan 0

# Clé obligatoire, gratuite: https://keymaster.fivem.net (New Server)
sv_licenseKey "A_REMPLIR_KEYMASTER_LICENSE_KEY"

# -----------------------------------------------------------------------
# ONESYNC — obligatoire au-delà de 32 joueurs, recommandé dans tous les cas
# -----------------------------------------------------------------------
set onesync on
set onesync_enableInfinity 1
set onesync_enableBeyond 1
# Réduit la bande passante en ne synchronisant pas les véhicules trop loin
set onesync_distanceCullVehicles true

# -----------------------------------------------------------------------
# PERFORMANCE / RESEAU
# -----------------------------------------------------------------------
# Débit réseau max par client (bits/s) — augmentez si vous avez de la marge serveur
set sv_maxRate 1000000

# Empêche le vol de contrôle d'entité (anti desync / anti "car flip" exploit)
# 1 = bloque les requêtes vers les entités joueurs occupées depuis > 30s
set sv_filterRequestControl 1
set sv_filterRequestControlSettleTimer 30000

# Bloque les .asi "mod menu" externes qui utilisent l'API ScriptHookV
set sv_scriptHookAllowed 0

# -----------------------------------------------------------------------
# SECURITE / ANTI-TRICHE
# -----------------------------------------------------------------------
# Verrouille le serveur sur une build GTA V précise pour éviter les décalages
# de compatibilité. Vérifiez la build recommandée actuelle avant activation:
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild
# set sv_enforceGameBuild 3407

# Steam Web API (optionnel mais recommandé): https://steamcommunity.com/dev/apikey
# set steam_webApiKey "A_REMPLIR_OU_LAISSER_VIDE"

exec permissions.cfg

# -----------------------------------------------------------------------
# BASE DE DONNEES (oxmysql) — https://github.com/overextended/oxmysql
# -----------------------------------------------------------------------
set mysql_connection_string "mysql://USER:PASSWORD@localhost/track_ia?charset=utf8mb4"

# -----------------------------------------------------------------------
# RESOURCES — ordre de démarrage important (dépendances)
# -----------------------------------------------------------------------
ensure oxmysql

# framework
ensure core
ensure inventory
ensure medical
ensure banking
ensure admin
ensure dispatch

# interfaces
ensure hud
ensure multichar
ensure phone

# emplois
ensure police
ensure ems
ensure mechanic
ensure taxi

# monde / économie
ensure vehicles
ensure housing
ensure shops
ensure drugs

# -----------------------------------------------------------------------
# DIVERS
# -----------------------------------------------------------------------
set sv_asyncdiskio true

# Bannière & pack de démarrage (personnalisez avec vos propres visuels)
# sets banner_detail "https://votre-domaine.tld/banner-detail.png"
# sets banner_connecting "https://votre-domaine.tld/banner-connecting.png"
