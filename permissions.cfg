## =====================================================================
## Track-IA RP — Permissions (ACE)
## Exécuté depuis server.cfg via: exec permissions.cfg
##
## Remplacez les identifiants ci-dessous par les VRAIS identifiants
## Rockstar License de votre équipe (visibles dans les logs serveur à la
## connexion, ou via https://policroblox... non - utilisez simplement le
## chat serveur : la commande /id une fois en jeu affiche votre identifiant
## dans la console serveur au moment de la connexion, ou lisez le log au
## join: "license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx").
## =====================================================================

# --- Groupes ---
add_ace group.admin command allow          # accès à toutes les commandes RegisterCommand(..., true)
add_ace group.admin trackia.admin allow    # utilisé par l'anti-cheat pour cibler les alertes
add_ace group.moderator command.kick allow
add_ace group.moderator command.tempban allow
add_ace group.moderator command.goto allow
add_ace group.moderator command.bring allow
add_ace group.moderator command.revive allow
add_ace group.moderator command.noclip allow
add_ace group.moderator trackia.admin allow

# --- Owners (accès complet) ---
# add_principal identifier.license:REMPLACER_PAR_VOTRE_LICENSE group.admin

# --- Modérateurs ---
# add_principal identifier.license:REMPLACER_PAR_UNE_LICENSE group.moderator

# Astuce: un joueur peut appartenir à plusieurs principaux, ex:
# add_principal group.moderator group.admin   (rend tous les admins modérateurs aussi)
add_principal group.moderator group.admin
