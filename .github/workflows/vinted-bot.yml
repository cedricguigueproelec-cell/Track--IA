name: Bot alertes Vinted

on:
  schedule:
    # 5 minutes = le minimum permis par GitHub pour un cron programmé.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Actions épinglées à leur commit (pas juste au tag) : le tag "v7"
      # pourrait en théorie être redirigé vers un autre code, le hash non.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Vérifier que le secret webhook est configuré
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "::error::Le secret DISCORD_WEBHOOK_URL n'est pas configuré (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer les dépendances
        working-directory: vinted-discord-bot
        run: pip install -r requirements.txt

      - name: Vérifier Vinted et notifier Discord
        working-directory: vinted-discord-bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VINTED_DOMAIN: vinted.fr
          CONFIG_PATH: config.yaml
          STATE_PATH: seen_items.json
          BRAND_CACHE_PATH: brand_cache.json
        run: python bot.py --once

      # if: always() : même si l'étape précédente échoue (bug, incident
      # Vinted...), on sauvegarde quand même tout progrès déjà fait (ex: une
      # marque résolue avant l'échec) plutôt que de le perdre.
      - name: Sauvegarder l'état (annonces vues + marques résolues)
        if: always()
        working-directory: vinted-discord-bot
        run: |
          if ! git diff --quiet -- seen_items.json brand_cache.json; then
            git config user.name "vinted-bot"
            git config user.email "actions@github.com"
            git add seen_items.json brand_cache.json
            git commit -m "chore: update bot state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
