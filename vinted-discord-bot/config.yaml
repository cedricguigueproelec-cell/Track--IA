# Config active, utilisée à la fois en local et par le workflow GitHub
# Actions. Modifiez-la et poussez sur la branche par défaut pour changer les
# marques suivies. Seules les marques listées ici sont surveillées : les
# marques "fast fashion" (Shein, Kiabi, etc.) ne sont donc jamais remontées,
# puisqu'elles ne sont simplement pas dans la liste.
#
# Après chaque modification, relancez le bot une fois et regardez les
# lignes "Marque résolue: ..." dans les logs : si une marque affiche un
# WARNING de correspondance approximative, corrigez son nom ici pour qu'il
# colle exactement à celui utilisé sur Vinted.

# Prix maximum par défaut (en EUR) si une marque ne précise pas le sien.
default_max_price: 25

